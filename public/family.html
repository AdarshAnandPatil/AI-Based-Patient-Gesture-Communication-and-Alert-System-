<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Family View | AI Patient Care</title>
<link rel="stylesheet" href="css/command.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0d0728 0%,#1a0a45 100%);min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff}
.family-wrap{max-width:480px;margin:0 auto;padding:16px 14px 80px}
.family-head{display:flex;justify-content:space-between;align-items:center;padding:18px 0 14px}
.family-head h1{font-size:20px;font-weight:800;color:#fff}
.family-head .eyebrow{font-size:10px;font-weight:800;letter-spacing:.1em;color:#c4a8ff}
.family-head .live-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.family-head .live-chip i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:18px;margin-bottom:14px}
.card-label{font-size:10px;font-weight:800;letter-spacing:.12em;color:#c4a8ff;margin-bottom:10px}
.patient-name{font-size:26px;font-weight:800;color:#fff;margin-bottom:4px}
.patient-meta{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:10px}
.patient-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.patient-grid span{font-size:11px;color:rgba(255,255,255,.6)}
.patient-grid strong{display:block;font-size:13px;color:#fff;font-weight:700;margin-top:2px}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.35);border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;color:#34d399}
.status-pill.attention{background:rgba(251,146,60,.15);border-color:rgba(251,146,60,.35);color:#fb923c}
.live-card{background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(215,47,163,.25));border:1px solid rgba(124,58,237,.45);border-radius:20px;padding:18px;margin-bottom:14px}
.live-signal-name{font-size:22px;font-weight:800;color:#fff;margin:8px 0 4px}
.live-signal-name.emergency{color:#ff6b6b}
.live-signal-name.attention{color:#fb923c}
.live-conf{font-size:12px;color:rgba(255,255,255,.65)}
.live-icon{font-size:36px;margin-bottom:6px}
.no-signal{font-size:14px;color:rgba(255,255,255,.5);font-style:italic;padding:8px 0}
.alert-item{display:flex;gap:12px;align-items:flex-start;padding:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;margin-bottom:10px}
.alert-item.emergency{background:rgba(232,63,115,.12);border-color:rgba(232,63,115,.3)}
.alert-item.attention{background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.25)}
.alert-icon-b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.1);flex-shrink:0}
.alert-req{font-size:14px;font-weight:700;color:#fff}
.alert-time{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px}
.alert-status-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700}
.pill.emergency{background:rgba(232,63,115,.25);color:#ff8fab}
.pill.attention{background:rgba(251,146,60,.25);color:#fb923c}
.pill.normal{background:rgba(52,211,153,.2);color:#34d399}
.pill.pending{background:rgba(255,255,255,.15);color:#fff}
.pill.acknowledged{background:rgba(52,211,153,.2);color:#34d399}
.pill.resolved{background:rgba(99,102,241,.25);color:#a5b4fc}
.empty-state{text-align:center;padding:28px 16px;color:rgba(255,255,255,.4);font-size:13px}
.login-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:28px 22px;margin-top:40px}
.login-card h2{font-size:22px;font-weight:800;margin:10px 0 6px}
.login-card p{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:20px;line-height:1.5}
.login-card label{display:block;font-size:11px;font-weight:700;color:#c4a8ff;margin-bottom:3px;margin-top:14px}
.login-card input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:11px 13px;color:#fff;font-size:14px;outline:none}
.login-card input:focus{border-color:#7c3aed}
.login-btn{width:100%;margin-top:18px;background:linear-gradient(110deg,#7c3aed,#d72fa3);color:#fff;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
.form-msg{font-size:12px;margin-top:10px;min-height:16px;color:#ff8fab}
.brand-mark{width:44px;height:44px;background:linear-gradient(135deg,#7c3aed,#d72fa3);border-radius:14px;display:grid;place-items:center;font-size:22px;margin-bottom:12px}
.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(13,7,40,.92);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.1);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.65)}
.foot button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 14px;color:#fff;font-size:12px;cursor:pointer}
.refresh-bar{font-size:10px;color:rgba(255,255,255,.4);text-align:center;margin-top:-8px;margin-bottom:10px}
@media(min-width:500px){.family-wrap{padding-top:24px}}
</style>
</head>
<body>
<div class="family-wrap" id="app"></div>
<script>
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const token=()=>localStorage.getItem('patientToken');
let userData=JSON.parse(localStorage.getItem('patientUser')||'null');
let syncTimer=null;

async function api(url,opts={}){
  opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};
  const r=await fetch(url,opts);
  const d=await r.json().catch(()=>({}));
  if(r.status===401){localStorage.clear();showLogin();throw new Error('Session expired');}
  if(!r.ok)throw new Error(d.message||'Request failed');
  return d;
}

function ago(ts){
  const s=Math.max(0,(Date.now()-new Date(ts))/1000);
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+' min ago';
  if(s<86400)return Math.floor(s/3600)+' h ago';
  return new Date(ts).toLocaleDateString();
}
function timeStr(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

function iconFor(req=''){
  const m=[['Breathing','🫁'],['Shake','🚨'],['Emergency','🚨'],['Water','💧'],['Nurse','🩺'],['Toilet','🚻'],['Thumbs Up','👍'],['Thumbs Down','👎'],['OK','✅'],['Pointing','👉'],['Help','🆘'],['Blink','👁️'],['Head','↔️'],['Smile','😊'],['Frown','😟'],['Mouth','😮']];
  for(const[k,v]of m)if(req.includes(k))return v;
  return '🔔';
}

function showLogin(){
  clearInterval(syncTimer);
  app.innerHTML=`
  <div class="login-card">
    <div class="brand-mark">✚</div>
    <div class="eyebrow">FAMILY PATIENT TRACKER</div>
    <h2>Sign in to view your patient</h2>
    <p>Your hospital will give you a login. You will see only your family member's signals and alerts.</p>
    <form id="lf">
      <label>Username</label><input id="lu" required autocomplete="username">
      <label>Password</label><input id="lp" type="password" required autocomplete="current-password">
      <button class="login-btn" type="submit">Sign in →</button>
      <div id="lm" class="form-msg"></div>
    </form>
  </div>`;
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const m=document.getElementById('lm');
    m.textContent='';
    try{
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('lu').value,password:document.getElementById('lp').value})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.message||'Login failed');
      if(d.user.role!=='family'){localStorage.clear();throw new Error('This page is for family members only. Staff should use the main dashboard.');}
      localStorage.setItem('patientToken',d.token);
      localStorage.setItem('patientUser',JSON.stringify(d.user));
      userData=d.user;
      showApp();
    }catch(x){m.textContent=x.message;}
  };
}

function renderPatient(p){
  return `<div class="card">
    <div class="card-label">YOUR PATIENT</div>
    <div class="patient-name">${esc(p.name)}</div>
    <div class="patient-meta">Room ${esc(p.room)} · Bed ${esc(p.bed)}</div>
    <span class="status-pill ${p.status==='Attention'?'attention':''}">${esc(p.status)}</span>
    <div class="patient-grid">
      <div><span>Condition</span><strong>${esc(p.condition)}</strong></div>
      <div><span>Doctor</span><strong>${esc(p.doctor)}</strong></div>
      <div><span>Nurse</span><strong>${esc(p.nurse)}</strong></div>
      <div><span>Priority</span><strong>${esc(p.priority)}</strong></div>
    </div>
  </div>`;
}

function renderLive(live){
  if(!live||!live.currentGesture||live.currentGesture==='No hand detected'||live.currentGesture==='Camera offline'||live.currentGesture==='No Face'||live.detectionStatus==='Ready'){
    return `<div class="live-card">
      <div class="card-label">LIVE SIGNAL</div>
      <div class="no-signal">No active signal — patient is at rest</div>
    </div>`;
  }
  const em=live.priority==='emergency';
  const at=live.priority==='attention';
  return `<div class="live-card">
    <div class="card-label">LIVE SIGNAL</div>
    <div class="live-icon">${iconFor(live.currentGesture||'')}</div>
    <div class="live-signal-name ${em?'emergency':at?'attention':''}">${esc(live.currentGesture)}</div>
    <div class="live-conf">${live.confidence?live.confidence+'% confidence · ':''}${live.detectionStatus||''} · ${live.timestamp?ago(live.timestamp):'just now'}</div>
  </div>`;
}

function renderSummary(summary={}){return `<div class="card"><div class="card-label">TODAY'S PATIENT SUMMARY</div><div class="patient-grid"><div><span>Total gestures</span><strong>${summary.totalGestures||0}</strong></div><div><span>Water requests</span><strong>${summary.water||0}</strong></div><div><span>Help requests</span><strong>${summary.help||0}</strong></div><div><span>Emergency requests</span><strong>${summary.emergency||0}</strong></div><div><span>Completed</span><strong>${summary.completed||0}</strong></div><div><span>Pending</span><strong>${summary.pending||0}</strong></div></div></div>`;}
function renderTimeline(alerts){const rows=(alerts||[]).slice(0,15);return `<div class="card"><div class="card-label">PATIENT ACTIVITY TIMELINE</div>${rows.length?rows.map(a=>`<div class="alert-item"><div class="alert-icon-b">${iconFor(a.requirement||a.gesture)}</div><div style="flex:1"><div class="alert-req">${esc(a.requirement||a.gesture)}</div><div class="alert-time">${new Date(a.timestamp).toLocaleString()}</div><div class="alert-status-row"><span class="pill ${esc(a.priority)}">${esc(a.priority)}</span><span class="pill ${esc(a.status)}">${esc(a.status)}</span></div></div></div>`).join(''):'<div class="empty-state">No activity recorded today.</div>'}</div>`;}
function renderUpdates(rows){return `<div class="card"><div class="card-label">NURSE-TO-FAMILY UPDATES</div>${rows?.length?rows.map(x=>`<div class="alert-item"><div class="alert-icon-b">🩺</div><div style="flex:1"><div class="alert-req">${esc(x.author)} · ${esc(x.authorRole)}</div><div class="alert-time">${new Date(x.timestamp).toLocaleString()}</div><div style="font-size:13px;margin-top:6px;line-height:1.5">${esc(x.message)}</div></div></div>`).join(''):'<div class="empty-state">No nurse updates yet.</div>'}</div>`;}
function renderSafety(rows){return `<div class="card"><div class="card-label">VISUAL PATIENT SAFETY EVENTS</div>${rows?.length?rows.map(x=>`<div class="alert-item ${x.priority==='critical'?'emergency':'attention'}"><div class="alert-icon-b">⚠️</div><div style="flex:1"><div class="alert-req">${esc(x.eventType)}</div><div class="alert-time">${new Date(x.timestamp).toLocaleString()}</div><div class="alert-status-row"><span class="pill ${x.priority==='critical'?'emergency':'attention'}">${esc(x.priority)}</span><span class="pill ${esc(x.status)}">${esc(x.status.replaceAll('_',' '))}</span></div>${x.note?`<div class="alert-time">${esc(x.note)}</div>`:''}</div></div>`).join(''):'<div class="empty-state">No visual safety events recorded.</div>'}</div>`;}
function renderMedical(rows){return `<div class="card"><div class="card-label">MEDICAL EVENT UPDATES</div>${rows?.length?rows.map(x=>`<div class="alert-item emergency"><div class="alert-icon-b">🚨</div><div style="flex:1"><div class="alert-req">${esc(x.eventType)}</div><div class="alert-time">${new Date(x.timestamp).toLocaleString()} · ${esc(x.status)}</div>${x.note?`<div class="alert-time">${esc(x.note)}</div>`:''}</div></div>`).join(''):'<div class="empty-state">No medical event updates.</div>'}</div>`;}

function renderAlerts(alerts){
  if(!alerts||!alerts.length)return `<div class="card"><div class="card-label">RECENT ALERTS</div><div class="empty-state">No alerts recorded yet.<br>All is calm.</div></div>`;
  return `<div class="card">
    <div class="card-label">RECENT ALERTS (${alerts.length})</div>
    ${alerts.slice(0,15).map(a=>`
    <div class="alert-item ${a.priority==='emergency'?'emergency':a.priority==='attention'?'attention':''}">
      <div class="alert-icon-b">${iconFor(a.requirement)}</div>
      <div style="flex:1;min-width:0">
        <div class="alert-req">${esc(a.requirement)}</div>
        <div class="alert-time">${timeStr(a.timestamp)} · ${ago(a.timestamp)}</div>
        <div class="alert-status-row">
          <span class="pill ${a.priority}">${esc(a.priority)}</span>
          <span class="pill ${a.status}">${esc(a.status)}</span>
          ${a.acknowledgedAt?`<span class="pill acknowledged">Ack ${timeStr(a.acknowledgedAt)}</span>`:''}
          ${a.resolvedAt?`<span class="pill resolved">Resolved ${timeStr(a.resolvedAt)}</span>`:''}
        </div>
      </div>
    </div>`).join('')}
  </div>`;
}

async function syncData(){
  try{
    const d=await api('/api/family/me');
    const main=document.getElementById('familyMain');
    if(!main)return;
    main.innerHTML=renderPatient(d.patient)+renderLive(d.live)+renderSummary(d.summary)+renderAlerts(d.alerts)+renderTimeline(d.alerts)+renderSafety(d.safetyEvents)+renderMedical(d.medicalEvents)+renderUpdates(d.updates);
    document.getElementById('lastSync').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){if(e.message==='Session expired')return;}
}

function showApp(){
  clearInterval(syncTimer);
  app.innerHTML=`
  <div class="family-head">
    <div>
      <div class="eyebrow">FAMILY PATIENT TRACKER</div>
      <h1>Your Patient's Status</h1>
    </div>
    <div class="live-chip"><i></i> Live</div>
  </div>
  <div class="refresh-bar">Auto-refreshes every 10 s · <span id="lastSync">Connecting…</span></div>
  <div id="familyMain"><div class="empty-state" style="margin-top:40px">Loading patient data…</div></div>
  <div class="foot"><span>${esc(userData?.name||'Family')}</span><div style="display:flex;gap:8px"><button id="notifyBtn">Enable alerts</button><button id="loBtn">Sign out</button></div></div>`;
  document.getElementById('notifyBtn').onclick=async()=>{if(!('Notification' in window)){alert('Browser notifications are not supported on this device.');return;}const permission=await Notification.requestPermission();alert(permission==='granted'?'Notifications enabled while this portal is open.':'Notification permission was not granted.');};
  document.getElementById('loBtn').onclick=()=>{
    clearInterval(syncTimer);
    fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token()}}).catch(()=>{});
    localStorage.clear();userData=null;showLogin();
  };
  syncData();
  syncTimer=setInterval(syncData,10000);
  // SSE for instant push
  try{
    const es=new EventSource('/api/events?token='+encodeURIComponent(token()));
    es.onmessage=e=>{try{const d=JSON.parse(e.data);if(['alert','family-update','safety-event','medical-event'].includes(d.type)&&'Notification'in window&&Notification.permission==='granted'){const p=d.payload||{};new Notification(p.requirement||p.eventType||'Patient update',{body:p.message||`${p.patient||p.patientName||'Your patient'} · ${p.status||'New update'}`});}if(['alert','live','family-update','safety-event','medical-event'].includes(d.type))syncData();}catch(x){}};
  }catch(x){}
}

// Boot
if(token()&&userData&&userData.role==='family'){showApp();}
else{localStorage.removeItem('patientToken');localStorage.removeItem('patientUser');userData=null;showLogin();}
</script>
</body>
</html>
