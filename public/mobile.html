<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Nurse Mobile | AI Patient Care</title><link rel="stylesheet" href="css/command.css"></head><body><main class="mobile-wrap" id="app"></main><script>
const app=document.getElementById('app');const token=()=>localStorage.getItem('patientToken');const hdr=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token()});let user=JSON.parse(localStorage.getItem('patientUser')||'null');
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.clear();renderLogin();throw new Error('Session expired')}if(!r.ok)throw new Error(d.message||'Request failed');return d}
function renderLogin(){app.innerHTML=`<section class="login-card mobile-login"><div class="brand-mark">✚</div><div class="card-kicker">NURSE MOBILE</div><h2>Secure nurse access</h2><p class="muted">Connect this phone to the same hospital Wi-Fi as the AI monitoring computer.</p><form id="f"><label>Username<input id="u" required></label><label>Password<input id="p" type="password" required></label><button class="primary-btn">Open Nurse Monitor →</button><div id="m" class="form-msg"></div></form></section>`;f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!r.ok)throw new Error(d.message);localStorage.setItem('patientToken',d.token);localStorage.setItem('patientUser',JSON.stringify(d.user));user=d.user;renderApp()}catch(x){m.textContent=x.message;m.className='form-msg error'}}}
function renderApp(){app.innerHTML=`<header class="mobile-head"><div><span class="eyebrow">NURSE MOBILE</span><h1>Patient Calls</h1></div><div><span class="live-chip"><i></i> Live LAN</span></div></header><section id="mobileLive"></section><section id="mobileAlerts"></section><div class="mobile-foot"><span>${user?.name||'Nurse'}</span><button id="lo">Logout</button></div>`;document.getElementById('lo').onclick=()=>{fetch('/api/logout',{method:'POST',headers:hdr()});localStorage.clear();renderLogin()};sync();}
function alertCard(a){return `<div class="alert-card ${a.priority==='emergency'?'emergency':''}"><div class="alert-icon">${a.priority==='emergency'?'🚨':'🔔'}</div><div class="alert-main"><div class="alert-title"><b>${a.requirement}</b><span class="priority ${a.priority}">${a.priority}</span></div><p>${a.patient} · Room ${a.room} · Bed ${a.bed}</p><small>${a.gesture} · Confidence ${a.confidence}%</small><div class="alert-message">${a.message}</div><div class="alert-actions">${a.status==='pending'?`<button onclick="status('${a.id}','acknowledged')">Acknowledge</button>`:''}${a.status!=='resolved'?`<button class="success" onclick="status('${a.id}','resolved')">Resolve</button>`:''}</div></div></div>`}
async function sync(){try{const [live,alerts,patients]=await Promise.all([api('/api/live-status'),api('/api/alerts?status=pending'),api('/api/patients')]);document.getElementById('mobileLive').innerHTML=`<section class="panel mobile-live"><div class="panel-head"><div><b>Latest communication</b><span>Real-time patient → nurse signal</span></div><span class="badge ${live.priority==='emergency'?'warning':'good'}">${live.detectionStatus}</span></div><div class="mobile-radar"><div class="big-gesture">${live.priority==='emergency'?'🚨':'✋'}</div><div><b>${live.currentGesture}</b><span>${live.patientName} · Room ${live.room} · Bed ${live.bed}</span><small>Confidence ${live.confidence}% · ${new Date(live.timestamp).toLocaleTimeString()}</small></div></div><div class="validation-result accepted"><b>✓ Hospital PC connected</b><span>Alerts are synchronized over the local Wi-Fi network.</span></div></section><section class="panel"><div class="panel-head"><div><b>Active calls</b><span>${alerts.length} pending</span></div></div>${alerts.length?alerts.map(alertCard).join(''):'<div class="empty">No pending calls.</div>'}</section>`}catch(e){}}
async function status(id,s){try{await api('/api/alerts/'+id,{method:'PATCH',headers:hdr(),body:JSON.stringify({status:s})});sync()}catch(e){alert(e.message)}}
const es=new EventSource('/api/events');es.onmessage=e=>{try{const d=JSON.parse(e.data);if(['alert','live','patients'].includes(d.type))sync()}catch{}};if(token())renderApp();else renderLogin();
</script><style>.mobile-wrap{width:min(760px,100%);margin:auto;padding:16px}.mobile-head{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 18px}.mobile-head h1{margin:3px 0 0;font-size:25px}.mobile-live{margin-bottom:12px}.mobile-radar{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(20,184,166,.08));border:1px solid var(--line)}.big-gesture{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:rgba(168,85,247,.16);font-size:32px}.mobile-radar b,.mobile-radar span,.mobile-radar small{display:block}.mobile-radar span{color:var(--ink);font-size:12px;margin-top:4px}.mobile-radar small{color:var(--muted);font-size:9px;margin-top:4px}.mobile-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:12px}.mobile-foot button{border:0;background:transparent;color:var(--red)}.mobile-login{margin-top:16vh}.mobile-login .brand-mark{margin-bottom:15px}</style></body></html>
