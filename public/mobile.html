<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Nurse Mobile | AI Patient Care</title><link rel="stylesheet" href="css/command.css"></head><body><main class="mobile-wrap" id="app"></main><script>
const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const token=()=>localStorage.getItem('patientToken');const hdr=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token()});let user=JSON.parse(localStorage.getItem('patientUser')||'null');
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.clear();renderLogin();throw new Error('Session expired')}if(!r.ok)throw new Error(d.message||'Request failed');return d}
function renderLogin(){app.innerHTML=`<section class="login-card mobile-login"><div class="brand-mark">✚</div><div class="card-kicker">ADMIN MOBILE MONITOR</div><h2>Secure admin access</h2><p class="muted">Connect this phone to the same hospital Wi-Fi as the AI monitoring computer.</p><form id="f"><label>Username<input id="u" required></label><label>Password<input id="p" type="password" required></label><button class="primary-btn">Open Mobile Monitor →</button><div id="m" class="form-msg"></div></form></section>`;f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!r.ok)throw new Error(d.message);localStorage.setItem('patientToken',d.token);localStorage.setItem('patientUser',JSON.stringify(d.user));user=d.user;if(d.user&&d.user.role==='family'){location.href='/family';}else{renderApp();}}catch(x){m.textContent=x.message;m.className='form-msg error'}}}
function renderApp(){app.innerHTML=`<header class="mobile-head"><div><span class="eyebrow">ADMIN MOBILE MONITOR</span><h1>Patient Calls</h1></div><div><span class="live-chip"><i></i> Live LAN</span></div></header><section id="mobileLive"></section><section id="mobileAlerts"></section><section id="staffTools"></section><div class="mobile-foot"><span>${user?.name||'Admin'}</span><button id="lo">Logout</button></div>`;document.getElementById('lo').onclick=()=>{fetch('/api/logout',{method:'POST',headers:hdr()});localStorage.clear();renderLogin()};sync();}
function alertCard(a){return `<div class="alert-card ${a.priority==='emergency'?'emergency':''}"><div class="alert-icon">${a.priority==='emergency'?'🚨':'🔔'}</div><div class="alert-main"><div class="alert-title"><b>${esc(a.requirement)}</b><span class="priority ${esc(a.priority)}">${esc(a.priority)}</span><span class="state ${esc(a.status)}">${esc(a.status)}</span></div><p>${esc(a.patient)} · Room ${esc(a.room)} · Bed ${esc(a.bed)}</p><small>${esc(a.gesture)} · Confidence ${esc(a.confidence)}%</small><div class="alert-message">${esc(a.message)}</div><div class="alert-actions">${a.status==='pending'?`<button onclick="status('${esc(a.id)}','acknowledged')">Acknowledge</button>`:''}<button class="success" onclick="status('${esc(a.id)}','resolved')">Resolve</button></div></div></div>`}
async function sync(){try{const [live,all,patients,safety]=await Promise.all([api('/api/live-status'),api('/api/alerts'),api('/api/patients'),api('/api/safety-events')]);const alerts=all.filter(a=>['pending','acknowledged'].includes(a.status));document.getElementById('mobileLive').innerHTML=`<section class="panel mobile-live"><div class="panel-head"><div><b>Latest communication</b><span>Real-time patient → nurse signal</span></div><span class="badge ${live.priority==='emergency'?'warning':'good'}">${live.detectionStatus}</span></div><div class="mobile-radar"><div class="big-gesture">${live.priority==='emergency'?'🚨':'✋'}</div><div><b>${esc(live.currentGesture)}</b><span>${esc(live.patientName)} · Room ${live.room} · Bed ${live.bed}</span><small>Confidence ${live.confidence}% · ${new Date(live.timestamp).toLocaleTimeString()}</small></div></div><div class="validation-result accepted"><b>✓ Hospital PC connected</b><span>Alerts are synchronized over the local Wi-Fi network.</span></div></section><section class="panel"><div class="panel-head"><div><b>Active calls</b><span>${alerts.length} open</span></div></div>${alerts.length?alerts.map(alertCard).join(''):'<div class="empty">No pending calls.</div>'}</section>`;document.getElementById('staffTools').innerHTML=`<section class="panel"><div class="panel-head"><div><b>Family communication & safety reporting</b><span>Post a patient-specific update or report a visual safety observation for staff verification.</span></div></div><form id="familyUpdateForm" class="staff-form"><label>Patient<select name="patientId">${patients.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.room)}/${esc(p.bed)}</option>`).join('')}</select></label><label>Update for family<textarea name="message" required maxlength="1000" placeholder="Describe care provided or an important update..."></textarea></label><button class="primary-btn">Send family update</button></form><form id="medicalForm" class="staff-form"><label>Medical event<select name="eventType"><option>Suspected Heart Attack</option><option>Suspected Cardiac Arrest</option><option>Severe Breathing Difficulty</option><option>Suspected Stroke</option><option>Severe Bleeding</option><option>Patient Condition Critical</option><option>Patient Stabilized</option><option>Patient Death Confirmed by Doctor</option><option>Other Medical Emergency</option></select></label><label>Patient<select name="patientId">${patients.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.room)}/${esc(p.bed)}</option>`).join('')}</select></label><label>Clinical note<textarea name="note" placeholder="Enter verified clinical update."></textarea></label><label><input type="checkbox" name="confirmedByDoctor" value="true"> Doctor has confirmed this event (required for death record)</label><button class="primary-btn">Record medical event</button></form><form id="safetyForm" class="staff-form"><label>Visual safety event<select name="eventType"><option>Patient Fall</option><option>Seizure-like Movement</option><option>Prolonged Inactivity</option><option>Breathing Pattern Observation</option><option>Bed Exit Attempt</option><option>Patient Collapsing</option><option>Unusual Body Posture</option><option>Repeated Restless Movement</option><option>Unusual Night-time Activity</option></select></label><label>Patient<select name="patientId">${patients.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.room)}/${esc(p.bed)}</option>`).join('')}</select></label><label>Observation note<textarea name="note" placeholder="What was observed? Nurse must verify."></textarea></label><button class="primary-btn">Report safety observation</button></form><div><b>Recent safety events</b>${safety.slice(0,5).map(x=>`<p class="safety-row">${esc(x.eventType)} · ${esc(x.patientName)} · ${esc(x.status)}</p>`).join('')||'<p class="muted">No safety events.</p>'}</div></section>`;
document.getElementById('familyUpdateForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/family-updates',{method:'POST',headers:hdr(),body:JSON.stringify(b)});e.target.reset();alert('Family update sent.');}catch(x){alert(x.message)}};
document.getElementById('medicalForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),b=Object.fromEntries(fd);b.confirmedByDoctor=fd.get('confirmedByDoctor')==='true';try{await api('/api/medical-events',{method:'POST',headers:hdr(),body:JSON.stringify(b)});e.target.reset();alert('Medical event recorded and shared with authorized family.');}catch(x){alert(x.message)}};
document.getElementById('safetyForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/safety-events',{method:'POST',headers:hdr(),body:JSON.stringify(b)});e.target.reset();alert('Safety observation recorded for verification.');sync();}catch(x){alert(x.message)}};
}catch(e){}}
async function status(id,s){try{await api('/api/alerts/'+id,{method:'PATCH',headers:hdr(),body:JSON.stringify({status:s})});sync()}catch(e){alert(e.message)}}
let es;function connect(){es=new EventSource('/api/events?token='+encodeURIComponent(token()));es.onmessage=e=>{try{const d=JSON.parse(e.data);if(['alert','live','patients','family-update','safety-event','medical-event'].includes(d.type))sync()}catch{}};}
if(token()){connect();}if(token())renderApp();else renderLogin();
</script><style>.mobile-wrap{width:min(760px,100%);margin:auto;padding:16px}.mobile-head{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 18px}.mobile-head h1{margin:3px 0 0;font-size:25px}.mobile-live{margin-bottom:12px}.mobile-radar{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(20,184,166,.08));border:1px solid var(--line)}.big-gesture{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:rgba(168,85,247,.16);font-size:32px}.mobile-radar b,.mobile-radar span,.mobile-radar small{display:block}.mobile-radar span{color:var(--ink);font-size:12px;margin-top:4px}.mobile-radar small{color:var(--muted);font-size:9px;margin-top:4px}.mobile-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:12px}.mobile-foot button{border:0;background:transparent;color:var(--red)}.staff-form{display:grid;gap:10px;margin:12px 0 20px}.staff-form label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.staff-form select,.staff-form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}.staff-form textarea{min-height:72px}.safety-row{font-size:12px;padding:8px;border-bottom:1px solid var(--line)}.mobile-login{margin-top:16vh}.mobile-login .brand-mark{margin-bottom:15px}</style></body></html>
