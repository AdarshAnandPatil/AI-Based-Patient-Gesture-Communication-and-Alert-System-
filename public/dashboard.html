<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Patient Care | Command Center</title><link rel="stylesheet" href="css/command.css"></head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark small">✚</div><div><b>AI Patient Care</b><small>Command Center</small></div></div>
  <nav id="nav">
    <button data-page="dashboard" class="active">◈ <span>Dashboard</span></button>
    <button data-page="monitor">◉ <span>Live Monitor</span></button>
    <button data-page="patients">♙ <span>Patients</span></button>
    <button data-page="rooms">▦ <span>Rooms & Beds</span></button>
    <button data-page="appointments">◷ <span>Appointments</span></button>
    <button data-page="alerts">⚠ <span>Active Alerts</span><i id="alertBadge">0</i></button>
    <button data-page="history">⌁ <span>Alert History</span></button>
    <button data-page="reports">▤ <span>Reports & Analytics</span></button>
    <button data-page="settings">⚙ <span>System Settings</span></button>
    <button data-page="admin" class="admin-only">♜ <span>Admin & Audit</span></button>
  </nav>
  <div class="side-bottom"><a href="/mobile" target="_blank">📱 Nurse Mobile</a><button id="logoutBtn">↪ Logout</button></div>
</aside>
<main class="main">
<header class="topbar"><div><span class="eyebrow" id="pageEyebrow">OVERVIEW</span><h1 id="pageTitle">Hospital Command Center</h1></div><div class="top-actions"><span class="live-chip"><i></i><span id="connectionText">System online</span></span><button class="ghost-btn" id="wifiBtn">📱 Same-Wi-Fi</button><div class="user-chip"><span id="userAvatar">A</span><span id="userName">Admin</span></div></div></header>
<div id="page" class="page"></div>
<footer>AI-Based Patient Gesture Communication and Alert System · Assistive technology, not a replacement for clinical judgment · <b>Created by Adarsh Anand Patil</b></footer>
</main></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const T=localStorage.getItem('patientToken'); if(!T) location.href='/';
const state={page:'dashboard',user:JSON.parse(localStorage.getItem('patientUser')||'{}'),patients:[],alerts:[],rooms:[],appointments:[],reports:[],stats:{},settings:{}};
const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('patientToken')});
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+localStorage.getItem('patientToken')};const r=await fetch(url,opt);if(r.status===401){localStorage.clear();location.href='/';return;}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed');return d;}
function toast(s,kind=''){const t=document.getElementById('toast');t.textContent=s;t.className='toast show '+kind;setTimeout(()=>t.className='toast',2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function nav(page){state.page=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
document.getElementById('logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:headers()});localStorage.clear();location.href='/';};
document.getElementById('wifiBtn').onclick=async()=>{const n=await api('/api/network-info');modal(`<div class="modal-title">📱 Same-Wi-Fi Nurse Connection</div><p class="muted">Connect the nurse phone to the same hospital Wi-Fi as this computer.</p><div class="connect-box"><b>${esc(n.mobileUrl)}</b><span>Open this address on the nurse phone.</span></div><ol><li>Join the same Wi-Fi network.</li><li>Open the address above.</li><li>Use the authorized nurse account.</li></ol><p class="small">Core AI processing remains on the hospital PC. The local server synchronizes alerts over the LAN.</p>`)};
document.getElementById('userName').textContent=state.user.name||state.user.username||'User';document.getElementById('userAvatar').textContent=(state.user.name||'U').charAt(0).toUpperCase();if(state.user.role!=='admin')document.querySelector('.admin-only').style.display='none';
async function load(){[state.patients,state.alerts,state.rooms,state.appointments,state.reports,state.stats]=await Promise.all([api('/api/patients'),api('/api/alerts'),api('/api/rooms'),api('/api/appointments'),api('/api/reports'),api('/api/stats')]); if(state.user.role==='admin') state.settings=await api('/api/settings'); if(state.user.role==='admin') state.settings=await api('/api/settings');document.getElementById('alertBadge').textContent=state.stats.pending+state.stats.acknowledged;}
function shell(title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${sub}</div><h2>${title}</h2></div><div>${actions}</div></div>`}
function stat(label,val,icon,cls){return `<div class="stat ${cls}"><div class="stat-icon">${icon}</div><div><b>${val}</b><span>${label}</span></div></div>`}
function patientCard(p){return `<div class="patient-card"><div class="patient-top"><div class="avatar">${esc(p.name[0])}</div><div><b>${esc(p.name)}</b><span>${esc(p.id)} · Room ${esc(p.room)} · Bed ${esc(p.bed)}</span></div><span class="status ${p.status==='Attention'?'attention':'ok'}">${esc(p.status)}</span></div><div class="patient-grid"><span>Condition<strong>${esc(p.condition)}</strong></span><span>Doctor<strong>${esc(p.doctor)}</strong></span><span>Nurse<strong>${esc(p.nurse)}</strong></span><span>Priority<strong>${esc(p.priority)}</strong></span></div><div class="card-actions"><button onclick="viewPatient('${p.id}')">View</button>${state.user.role==='admin'?`<button onclick="editPatient('${p.id}')">Edit</button><button class="danger" onclick="deletePatient('${p.id}')">Remove</button>`:''}</div></div>`}
function alertCard(a){const emergency=a.priority==='emergency';return `<div class="alert-card ${emergency?'emergency':''}"><div class="alert-icon">${emergency?'🚨':a.type==='invalid_gesture'?'🛡️':'🔔'}</div><div class="alert-main"><div class="alert-title"><b>${esc(a.requirement)}</b><span class="priority ${a.priority}">${esc(a.priority)}</span><span class="state ${a.status}">${esc(a.status)}</span></div><p>${esc(a.patient)} · Room ${esc(a.room)} · Bed ${esc(a.bed)}</p><small>${esc(a.gesture)} · Confidence ${a.confidence}% · ${new Date(a.timestamp).toLocaleString()}</small><div class="alert-message">${esc(a.message)}</div></div><div class="alert-actions">${a.status==='pending'?'<button onclick="alertStatus(\''+a.id+'\',\'acknowledged\')">Acknowledge</button>':''}${a.status!=='resolved'&&a.status!=='archived'?'<button class="success" onclick="alertStatus(\''+a.id+'\',\'resolved\')">Resolve</button>':''}${a.status==='resolved'&&state.user.role==='admin'?'<button onclick="alertStatus(\''+a.id+'\',\'archived\')">Archive</button>':''}</div></div>`}
async function render(){await load();const p=document.getElementById('page');let html='';
if(state.page==='dashboard')html=dashboard();
if(state.page==='monitor')html=monitor();
if(state.page==='patients')html=patientsPage();
if(state.page==='rooms')html=roomsPage();
if(state.page==='appointments')html=appointmentsPage();
if(state.page==='alerts')html=alertsPage(false);
if(state.page==='history')html=alertsPage(true);
if(state.page==='reports')html=reportsPage();
if(state.page==='settings')html=settingsPage();
if(state.page==='admin')html=adminPage();
p.innerHTML=html;document.getElementById('pageTitle').textContent=({dashboard:'Hospital Command Center',monitor:'Live AI Monitor',patients:'Patient Admission & Management',rooms:'Ward Rooms & Bed Assignment',appointments:'Appointments & Care Schedule',alerts:'Active Patient Alerts',history:'Alert History & Response Timeline',reports:'Reports, Analytics & System Health',settings:'Detection & Communication Settings',admin:'Admin, Security & Audit'}[state.page]);document.getElementById('pageEyebrow').textContent=state.page.toUpperCase();bindPage();}
function dashboard(){const critical=state.alerts.filter(a=>a.status==='pending'||a.status==='acknowledged').slice(0,4);return `${shell('Hospital overview','REAL-TIME COMMAND CENTER','<button class="primary-btn compact" onclick="nav(\'monitor\')">Open Live Monitor →</button>')}<div class="stats">${stat('Patients',state.stats.patients,'♙','purple')}${stat('Pending response',state.stats.pending,'⏳','amber')}${stat('Acknowledged',state.stats.acknowledged,'👀','teal')}${stat('Resolved',state.stats.resolved,'✓','green')}${stat('Emergency alerts',state.stats.emergency,'🚨','red')}</div><div class="grid-2"><section class="panel hero-panel"><div class="panel-head"><div><b>Patient → AI → Nurse</b><span>End-to-end communication workflow</span></div><span class="badge good">SYSTEM READY</span></div><div class="workflow"><span>Patient signal</span><i>→</i><span>AI detection</span><i>→</i><span>Validation</span><i>→</i><span>Nurse alert</span><i>→</i><span>Acknowledge</span><i>→</i><span>Resolve</span></div><div class="mini-callout"><b>Safety principle</b><span>Unknown movements do not create patient needs or emergency alerts. Emergency communication follows a separate high-priority path.</span></div></section><section class="panel"><div class="panel-head"><div><b>Ward snapshot</b><span>Rooms 101–106 · 2 beds each</span></div><button class="link-btn" onclick="nav('rooms')">View rooms</button></div><div class="room-mini">${state.rooms.slice(0,6).map(r=>`<div class="room-chip ${r.occupied?(r.patient.priority==='Priority'?'attention':'occupied'):''}"><b>${r.room}/${r.bed}</b><span>${r.occupied?esc(r.patient.name):'Available'}</span></div>`).join('')}</div></section></div><section class="panel"><div class="panel-head"><div><b>Priority feed</b><span>Most recent actionable communications</span></div><button class="link-btn" onclick="nav('alerts')">All alerts</button></div>${critical.length?critical.map(alertCard).join(''):'<div class="empty">No active alerts. All monitored patients are currently stable.</div>'}</section><section class="panel"><div class="panel-head"><div><b>What makes this a real-world system?</b><span>Built around clinical workflow rather than a single AI demo</span></div></div><div class="value-grid"><div><b>01</b><span>Patient admission and room/bed mapping</span></div><div><b>02</b><span>Validated multimodal communication</span></div><div><b>03</b><span>False-alert protection and confidence gates</span></div><div><b>04</b><span>Same-Wi-Fi nurse response workflow</span></div><div><b>05</b><span>Emergency priority and audit trail</span></div><div><b>06</b><span>Reports, analytics, security and backup</span></div></div></section>`}
function monitor(){const p=state.patients[0]||{};return `${shell('Live AI Monitor','CAMERA + VALIDATION + PATIENT ASSOCIATION','<a class="ghost-btn" href="/camera" target="_blank">Open Full Camera →</a>')}<div class="grid-2 monitor-grid"><section class="camera-placeholder"><div class="camera-overlay"><span class="rec">● LIVE</span><span>AI camera runs on hospital PC</span></div><div class="camera-art">📹<strong>Live camera workspace</strong><small>Open the full camera monitor to use MediaPipe hand landmarks and the existing recognition engine.</small><a class="primary-btn" href="/camera" target="_blank">Start Camera Monitor</a></div></section><section class="panel detection-panel"><div class="panel-head"><div><b>Detection pipeline</b><span>Explainable validation</span></div><span class="badge good">READY</span></div><div class="detection-steps"><div class="step done">✓ Hand/face signal detected</div><div class="step done">✓ Supported communication matched</div><div class="step done">✓ Confidence threshold checked</div><div class="step">→ Patient / room / bed mapped</div><div class="step">→ Alert + voice + mobile sync</div></div><div class="current-target"><span>Current demo target</span><b>${esc(p.name||'Ravi Kumar')}</b><small>Room ${esc(p.room||'101')} · Bed ${esc(p.bed||'2')}</small></div></section></div><section class="panel"><div class="panel-head"><div><b>Verification & Simulation Suite</b><span>Use this during judging when a camera environment is unreliable. Simulation is clearly separated from live detection.</span></div><span class="badge warning">SIMULATION</span></div><div class="sim-grid">${['Pointing Finger','OK Sign','Thumbs Up','Thumbs Down','Water','Food','Nurse Assistance','Toilet','Difficulty Breathing','Emergency','Unknown Gesture'].map(g=>`<button onclick="simulate('${g}')">${g==='Pointing Finger'?'👉':g==='OK Sign'?'👌':g==='Difficulty Breathing'?'🫁':g==='Emergency'?'🚨':g==='Unknown Gesture'?'🛡️':'✋'}<span>${g}</span></button>`).join('')}</div><div id="validationResult" class="validation-result">Select a scenario. Valid signals create a tracked alert; Unknown Gesture is rejected and creates no alert.</div></section>`}
function patientsPage(){return `${shell('Patient Admission & Management','PATIENT → ROOM → BED → NURSE',state.user.role==='admin'?'<button class="primary-btn compact" onclick="addPatient()">+ Admit Patient</button>':'')}<section class="panel"><div class="panel-head"><div><b>Patient directory</b><span>Admin controls admission, assignment and updates. Duplicate room/bed assignments are blocked.</span></div><input class="search" id="patientSearch" placeholder="Search patient, ID, room…"></div><div id="patientList" class="patient-list">${state.patients.map(patientCard).join('')}</div></section>`}
function roomsPage(){const by={};state.rooms.forEach(r=>(by[r.room]??=[]).push(r));return `${shell('Ward Rooms & Bed Assignment','OCCUPANCY COMMAND MAP','<button class="ghost-btn" onclick="nav(\'patients\')">Manage patients</button>')}<section class="panel"><div class="room-grid">${Object.entries(by).map(([room,beds])=>`<div class="room-card"><div class="room-title"><b>Room ${room}</b><span>${beds.filter(x=>x.occupied).length}/2 occupied</span></div>${beds.map(r=>`<div class="bed-card ${r.occupied?'occupied':''} ${r.patient?.priority==='Priority'?'attention':''}"><div class="bed-icon">${r.occupied?'🛏️':'＋'}</div><div><b>Bed ${r.bed}</b><span>${r.occupied?esc(r.patient.name):'Available'}</span>${r.occupied?`<small>${esc(r.patient.condition)}</small>`:''}</div>${r.occupied?`<button onclick="viewPatient('${r.patient.id}')">View</button>`:'<span class="available">Available</span>'}</div>`).join('')}</div>`).join('')}</div></section>`}
function appointmentsPage(){return `${shell('Appointments & Care Schedule','ADMISSION + FOLLOW-UP WORKFLOW',state.user.role==='admin'?'<button class="primary-btn compact" onclick="addAppointment()">+ Add Appointment</button>':'')}<section class="panel"><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Room / Bed</th><th>Doctor</th><th>Specialty</th><th>Date</th><th>Reason</th><th>Status</th></tr></thead><tbody>${state.appointments.map(a=>`<tr><td><b>${esc(a.patientName)}</b><small>${esc(a.patientId)}</small></td><td>${esc(a.room)} / ${esc(a.bed)}</td><td>${esc(a.doctor)}</td><td>${esc(a.specialty)}</td><td>${esc(a.date)}<small>${esc(a.time)}</small></td><td>${esc(a.reason)}</td><td><span class="state ${a.status.toLowerCase()}">${esc(a.status)}</span></td></tr>`).join('')}</tbody></table></div></section>`}
function alertsPage(history){const list=state.alerts.filter(a=>history?['resolved','archived'].includes(a.status):['pending','acknowledged'].includes(a.status));return `${shell(history?'Alert History & Response Timeline':'Active Patient Alerts',history?'AUDITABLE COMMUNICATION RECORD':'ACKNOWLEDGE → RESOLVE',`<button class="ghost-btn" onclick="render()">↻ Refresh</button>`)}<section class="panel"><div class="filter-row"><span>${list.length} records</span><select id="alertFilter"><option value="all">All priorities</option><option value="emergency">Emergency</option><option value="attention">Attention</option><option value="normal">Normal</option></select></div>${list.length?list.map(alertCard).join(''):'<div class="empty">No records in this view.</div>'}</section>`}
function reportsPage(){const avg=state.alerts.filter(a=>a.acknowledgedAt&&a.timestamp).map(a=>(new Date(a.acknowledgedAt)-new Date(a.timestamp))/60000);const avgMin=avg.length?(avg.reduce((x,y)=>x+y,0)/avg.length).toFixed(1):'0.0';return `${shell('Reports & Analytics','RESPONSE QUALITY + SYSTEM HEALTH',state.user.role==='admin'?'<button class="ghost-btn" onclick="downloadBackup()">⬇ Backup JSON</button>':'')}<div class="stats">${stat('Average acknowledge time',avgMin+' min','⏱','purple')}${stat('Invalid gesture events',state.stats.invalidCount,'🛡️','amber')}${stat('Clinical reports',state.stats.reportsCount,'▤','teal')}${stat('Appointments',state.stats.appointmentsCount,'◷','green')}</div><div class="grid-2"><section class="panel"><div class="panel-head"><div><b>Communication analytics</b><span>Counts from alert history</span></div></div><div class="bars">${['Emergency','Attention','Normal'].map(k=>{const n=state.alerts.filter(a=>a.priority===k.toLowerCase()).length;const pct=Math.min(100,n*12+8);return `<div><span>${k}</span><i><b style="width:${pct}%"></b></i><strong>${n}</strong></div>`}).join('')}</div></section><section class="panel"><div class="panel-head"><div><b>System health</b><span>Local hospital deployment status</span></div></div><div class="health"><div>📷 Camera engine <b>READY</b></div><div>🧠 AI validation <b>ACTIVE</b></div><div>🖥️ Node server <b>RUNNING</b></div><div>📱 Nurse LAN sync <b>READY</b></div><div>🗃️ Local data store <b>ONLINE</b></div><div>🔐 Audit logging <b>ACTIVE</b></div></div></section></div><section class="panel"><div class="panel-head"><div><b>Clinical reports</b><span>Uploaded reports are stored locally with patient association.</span></div><button class="primary-btn compact" onclick="addReport()">+ Add Report</button></div><div class="report-list">${state.reports.length?state.reports.map(r=>`<div class="report-row"><b>${esc(r.title)}</b><span>${esc(r.patientName)} · ${esc(r.type)} · ${esc(r.date)}</span>${r.fileUrl?`<a href="${esc(r.fileUrl)}" target="_blank">Open file</a>`:''}</div>`).join(''):'<div class="empty">No reports uploaded yet.</div>'}</div></section>`}
function settingsPage(){const gs=state.settings.gestures||[];return `${shell('Detection & Communication Settings','SAFETY THRESHOLDS + MULTIMODAL COMMUNICATION','<span class="badge good">Protected</span>')}<section class="panel"><div class="panel-head"><div><b>Supported communication modes</b><span>Each mode is validated separately and feeds the same patient → nurse workflow.</span></div></div><div class="value-grid"><div><b>🤟 Hand</b><span>Pointing Finger, OK Sign, thumbs, 2–5 finger mappings</span></div><div><b>🙂 Face</b><span>Face communication hooks and controlled recognition path</span></div><div><b>👁 Eye Blink</b><span>Deliberate blink patterns with cooldown</span></div><div><b>↕ Head</b><span>Held movement and repeated movement validation</span></div><div><b>🫁 Emergency</b><span>Separate high-priority breathing/emergency path</span></div><div><b>🛡️ Invalid</b><span>Unknown movement is rejected and does not create an alert</span></div></div></section><section class="panel form-panel"><form id="settingsForm"><div class="form-grid"><label>Confirmed confidence %<input name="confirmedConfidenceThreshold" type="number" min="50" max="99" value="${state.settings.confirmedConfidenceThreshold||85}"></label><label>Emergency confidence %<input name="emergencyConfidenceThreshold" type="number" min="50" max="99" value="${state.settings.emergencyConfidenceThreshold||88}"></label><label>Same-gesture re-arm seconds<input name="rearmSeconds" type="number" min="1" max="60" value="${state.settings.rearmSeconds||5}"></label><label>Session timeout minutes<input name="sessionMinutes" type="number" min="5" max="240" value="${state.settings.sessionMinutes||30}"></label><label>Default voice language<select name="defaultLanguage"><option value="en" ${state.settings.defaultLanguage==='en'?'selected':''}>English</option><option value="kn" ${state.settings.defaultLanguage==='kn'?'selected':''}>ಕನ್ನಡ</option><option value="hi" ${state.settings.defaultLanguage==='hi'?'selected':''}>हिन्दी</option></select></label><label>Voice alerts<select name="voiceEnabled"><option value="true" ${state.settings.voiceEnabled?'selected':''}>Enabled</option><option value="false" ${!state.settings.voiceEnabled?'selected':''}>Disabled</option></select></label></div><div class="safety-box"><b>Safety controls</b><span>Emergency alerts remain protected. Unknown movements are rejected. Destructive actions require confirmation and are audit logged.</span></div><button class="primary-btn" type="submit">Save settings</button></form></section><section class="panel"><div class="panel-head"><div><b>Gesture & meaning registry</b><span>Admin can add, edit or remove mappings. Keep one unambiguous meaning per supported signal.</span></div><button class="ghost-btn" type="button" onclick="addGestureRow()">+ Add mapping</button></div><div id="gestureRows">${gs.map((g,i)=>`<div class="gesture-row" data-index="${i}"><input class="g-name" value="${esc(g.name)}"><input class="g-meaning" value="${esc(g.meaning)}"><select class="g-mode"><option ${g.mode==='Hand'?'selected':''}>Hand</option><option ${g.mode==='Eye'?'selected':''}>Eye</option><option ${g.mode==='Face'?'selected':''}>Face</option><option ${g.mode==='Head'?'selected':''}>Head</option><option ${g.mode==='Emergency'?'selected':''}>Emergency</option></select><button type="button" class="card-actions-btn danger" onclick="this.parentElement.remove()">Remove</button></div>`).join('')}</div><button class="primary-btn compact" type="button" onclick="saveGestureRegistry()">Save gesture registry</button></section><section class="panel form-panel"><div class="panel-head"><div><b>Change password</b><span>Stored using scrypt hashing; never displayed in the interface.</span></div></div><form id="passwordForm"><div class="form-grid"><label>Current password<input name="currentPassword" type="password" required></label><label>New password<input name="newPassword" type="password" minlength="8" required></label></div><button class="primary-btn" type="submit">Update password</button></form></section>`}
function addGestureRow(){const wrap=document.getElementById('gestureRows');const d=document.createElement('div');d.className='gesture-row';d.innerHTML='<input class="g-name" placeholder="Gesture name"><input class="g-meaning" placeholder="Patient meaning"><select class="g-mode"><option>Hand</option><option>Eye</option><option>Face</option><option>Head</option><option>Emergency</option></select><button type="button" class="card-actions-btn danger" onclick="this.parentElement.remove()">Remove</button>';wrap.appendChild(d)}
async function saveGestureRegistry(){const gestures=[...document.querySelectorAll('.gesture-row')].map(r=>({name:r.querySelector('.g-name').value.trim(),meaning:r.querySelector('.g-meaning').value.trim(),mode:r.querySelector('.g-mode').value})).filter(x=>x.name&&x.meaning);try{await api('/api/settings',{method:'PUT',headers:{...headers()},body:JSON.stringify({gestures})});toast('Gesture registry saved','success');state.settings.gestures=gestures}catch(x){toast(x.message,'error')}}
function adminPage(){return `${shell('Admin, Security & Audit','ROLE-BASED ACCESS + TRACEABILITY','<span class="badge good">ADMIN ONLY</span>')}<div class="role-grid"><div><b>Admin</b><span>Full management · patients · alerts · reports · settings · users · backup</span></div><div><b>Nurse</b><span>Live monitoring · acknowledge · resolve · assigned patient workflow</span></div><div><b>Viewer</b><span>Monitoring-only role for read-only deployments</span></div></div><section class="panel"><div class="panel-head"><div><b>Hospital user accounts</b><span>Create nurse/viewer accounts without exposing passwords.</span></div><button class="primary-btn compact" onclick="addUser()">+ Add User</button></div><div id="userList" class="report-list">Loading…</div></section><section class="panel"><div class="panel-head"><div><b>Audit log</b><span>Security-sensitive actions and workflow events</span></div></div><div id="auditList" class="audit-list">Loading…</div></section>`}
async function addUser(){modal(`<form id="userForm"><div class="modal-title">Create Hospital User</div><div class="form-grid"><label>Username<input name="username" required></label><label>Display name<input name="name" required></label><label>Role<select name="role"><option value="nurse">Nurse</option><option value="viewer">Viewer</option><option value="admin">Admin</option></select></label><label>Password<input name="password" type="password" minlength="8" required></label></div><div class="form-actions"><button type="button" class="ghost-btn" onclick="closeModal()">Cancel</button><button class="primary-btn">Create user</button></div></form>`);document.getElementById('userForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target).entries());try{await api('/api/users',{method:'POST',headers:{...headers()},body:JSON.stringify(b)});closeModal();toast('User created','success');render()}catch(x){toast(x.message,'error')}}}
async function removeUser(username){if(!confirm('Remove this account?'))return;try{await api('/api/users/'+encodeURIComponent(username),{method:'DELETE'});toast('User removed','success');render()}catch(x){toast(x.message,'error')}}
async function bindPage(){if(state.page==='patients'){const s=document.getElementById('patientSearch');if(s)s.oninput=()=>{const q=s.value.toLowerCase();document.getElementById('patientList').innerHTML=state.patients.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(patientCard).join('')||'<div class="empty">No patients found.</div>'};}if(state.page==='settings'){state.settings=await api('/api/settings');document.querySelector('#settingsForm').onsubmit=saveSettings;document.querySelector('#passwordForm').onsubmit=changePassword;}if(state.page==='admin'){const [logs,users]=await Promise.all([api('/api/audit'),api('/api/users')]);document.getElementById('auditList').innerHTML=logs.slice(0,80).map(l=>`<div><span>${new Date(l.timestamp).toLocaleString()}</span><b>${esc(l.action)}</b><span>${esc(l.user)}</span><p>${esc(l.details)}</p></div>`).join('')||'<div class="empty">No audit entries yet.</div>';document.getElementById('userList').innerHTML=users.map(u=>`<div class="report-row"><b>${esc(u.name)}</b><span>${esc(u.username)} · ${esc(u.role)}</span>${u.username!==state.user.username?`<button class="card-actions-btn danger" onclick="removeUser('${esc(u.username)}')">Remove</button>`:''}</div>`).join('');}}
function patientForm(p={}){return `<form id="patientForm"><div class="modal-title">${p.id?'Edit Patient':'Admit New Patient'}</div><div class="form-grid"><label>Patient ID<input name="id" value="${esc(p.id||'')}" placeholder="Auto-generated if blank" ${p.id?'readonly':''}></label><label>Full name<input name="name" required value="${esc(p.name||'')}"></label><label>Age<input name="age" type="number" value="${esc(p.age||'')}"></label><label>Gender<select name="gender"><option>Male</option><option ${p.gender==='Female'?'selected':''}>Female</option><option ${p.gender==='Other'?'selected':''}>Other</option></select></label><label>Room<input name="room" required value="${esc(p.room||'101')}"></label><label>Bed<input name="bed" required value="${esc(p.bed||'1')}"></label><label>Condition<input name="condition" value="${esc(p.condition||'')}"></label><label>Status<select name="status"><option ${p.status==='Normal'?'selected':''}>Normal</option><option ${p.status==='Monitoring'?'selected':''}>Monitoring</option><option ${p.status==='Attention'?'selected':''}>Attention</option></select></label><label>Assigned doctor<input name="doctor" value="${esc(p.doctor||'')}"></label><label>Assigned nurse<input name="nurse" value="${esc(p.nurse||'')}"></label><label>Emergency contact<input name="emergencyContact" value="${esc(p.emergencyContact||'')}"></label><label>Priority<select name="priority"><option ${p.priority==='Normal'?'selected':''}>Normal</option><option ${p.priority==='Priority'?'selected':''}>Priority</option><option ${p.priority==='Emergency'?'selected':''}>Emergency</option></select></label><label class="wide">Communication preferences<input name="communication" value="${esc((p.communication||[]).join(', '))}" placeholder="Pointing Finger, OK Sign, Eye Blink"></label><label class="wide">Notes<textarea name="notes">${esc(p.notes||'')}</textarea></label></div><div class="form-actions"><button type="button" class="ghost-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" type="submit">Save patient</button></div></form>`}
function addPatient(){modal(patientForm());document.getElementById('patientForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const b=Object.fromEntries(f.entries());b.communication=b.communication.split(',').map(x=>x.trim()).filter(Boolean);try{await api('/api/patients',{method:'POST',headers:{...headers()},body:JSON.stringify(b)});closeModal();toast('Patient admitted and bed assigned','success');render();}catch(x){toast(x.message,'error')}}}
function editPatient(id){const p=state.patients.find(x=>x.id===id);modal(patientForm(p));document.getElementById('patientForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const b=Object.fromEntries(f.entries());b.communication=b.communication.split(',').map(x=>x.trim()).filter(Boolean);try{await api('/api/patients/'+id,{method:'PUT',headers:{...headers()},body:JSON.stringify(b)});closeModal();toast('Patient details updated','success');render();}catch(x){toast(x.message,'error')}}}
function viewPatient(id){const p=state.patients.find(x=>x.id===id);const alerts=state.alerts.filter(a=>a.patientId===id);modal(`<div class="modal-title">${esc(p.name)}</div><div class="detail-hero"><b>Room ${esc(p.room)} · Bed ${esc(p.bed)}</b><span>${esc(p.condition)}</span></div><div class="detail-grid"><span>Patient ID<strong>${esc(p.id)}</strong></span><span>Doctor<strong>${esc(p.doctor)}</strong></span><span>Nurse<strong>${esc(p.nurse)}</strong></span><span>Priority<strong>${esc(p.priority)}</strong></span><span>Communication<strong>${esc((p.communication||[]).join(', '))}</strong></span><span>Emergency contact<strong>${esc(p.emergencyContact)}</strong></span></div><h4>Communication timeline</h4>${alerts.slice(0,8).map(a=>`<div class="timeline"><b>${esc(a.requirement)}</b><span>${new Date(a.timestamp).toLocaleString()} · ${a.confidence}% · ${a.status}</span></div>`).join('')||'<div class="empty">No alerts recorded for this patient.</div>'}`)}
async function deletePatient(id){if(!confirm('Remove this patient? A security audit entry will be created.'))return;try{await api('/api/patients/'+id,{method:'DELETE'});toast('Patient removed','success');render()}catch(x){toast(x.message,'error')}}
function addAppointment(){modal(`<form id="aptForm"><div class="modal-title">Add Appointment / Care Schedule</div><div class="form-grid"><label>Patient<select name="patientId" id="aptPatient">${state.patients.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.room}/${p.bed}</option>`).join('')}</select></label><label>Doctor<input name="doctor" required></label><label>Specialty<input name="specialty" required></label><label>Date<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>Time<input name="time" type="time" required></label><label>Priority<select name="priority"><option>Routine</option><option>Priority</option><option>Urgent</option></select></label><label class="wide">Reason<textarea name="reason" required></textarea></label></div><div class="form-actions"><button type="button" class="ghost-btn" onclick="closeModal()">Cancel</button><button class="primary-btn">Save appointment</button></div></form>`);document.getElementById('aptForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=Object.fromEntries(f.entries()),p=state.patients.find(x=>x.id===b.patientId);Object.assign(b,{patientName:p.name,room:p.room,bed:p.bed});try{await api('/api/appointments',{method:'POST',headers:{...headers()},body:JSON.stringify(b)});closeModal();toast('Appointment added','success');render()}catch(x){toast(x.message,'error')}}}
async function alertStatus(id,status){if(status==='archived'&&!confirm('Archive this alert? It will remain in the audit history.'))return;try{await api('/api/alerts/'+id,{method:'PATCH',headers:{...headers()},body:JSON.stringify({status})});toast('Alert '+status,'success');render()}catch(x){toast(x.message,'error')}}
async function simulate(gesture){const p=state.patients[0];try{const d=await api('/api/simulate',{method:'POST',headers:{...headers()},body:JSON.stringify({gesture,patientId:p.id})});const box=document.getElementById('validationResult');box.className='validation-result '+(d.validation.accepted?'accepted':'rejected');box.innerHTML=`<b>${d.validation.accepted?'✓ VALIDATED':'🛡️ REJECTED'}</b><span>${esc(d.validation.reason)}</span>${d.alert?`<small>${esc(d.alert.requirement)} · ${d.alert.confidence}% · Room ${d.alert.room} Bed ${d.alert.bed}</small>`:''}`;toast(d.validation.accepted?'Alert generated and synced':'Unknown movement rejected',d.validation.accepted?'success':'warn');state.alerts.unshift(...(d.alert?[d.alert]:[]));document.getElementById('alertBadge').textContent=state.stats.pending+state.stats.acknowledged+(d.alert?1:0);}catch(x){toast(x.message,'error')}}
async function saveSettings(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target).entries());b.voiceEnabled=b.voiceEnabled==='true';try{await api('/api/settings',{method:'PUT',headers:{...headers()},body:JSON.stringify(b)});toast('Settings saved','success')}catch(x){toast(x.message,'error')}}
async function changePassword(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target).entries());try{await api('/api/change-password',{method:'POST',headers:{...headers()},body:JSON.stringify(b)});e.target.reset();toast('Password changed','success')}catch(x){toast(x.message,'error')}}
async function downloadBackup(){try{const r=await fetch('/api/backup',{headers:{Authorization:'Bearer '+localStorage.getItem('patientToken')}});if(!r.ok)throw new Error('Backup request failed');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='patient-system-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded','success')}catch(x){toast(x.message,'error')}}
function addReport(){modal(`<form id="reportForm" enctype="multipart/form-data"><div class="modal-title">Add Clinical Report</div><div class="form-grid"><label>Patient<select name="patientId">${state.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Title<input name="title" required></label><label>Type<input name="type" value="General"></label><label>Doctor<input name="doctor"></label><label class="wide">Summary<textarea name="summary"></textarea></label><label class="wide">Optional file<input name="reportFile" type="file"></label></div><div class="form-actions"><button type="button" class="ghost-btn" onclick="closeModal()">Cancel</button><button class="primary-btn">Save report</button></div></form>`);document.getElementById('reportForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=state.patients.find(x=>x.id===f.get('patientId'));f.append('patientName',p.name);f.append('room',p.room);f.append('bed',p.bed);try{await api('/api/reports',{method:'POST',body:f});closeModal();toast('Report saved','success');render()}catch(x){toast(x.message,'error')}}}
const es=new EventSource('/api/events');es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='alert'||d.type==='live'||d.type==='patients'){load().then(()=>{document.getElementById('alertBadge').textContent=state.stats.pending+state.stats.acknowledged;if(state.page==='dashboard'||state.page==='alerts'||state.page==='history')render()})}}catch{}};es.onerror=()=>document.getElementById('connectionText').textContent='Reconnecting…';
render();
</script></body></html>
